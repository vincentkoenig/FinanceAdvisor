name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Echte PostgreSQL-Datenbank (gleiche Hauptversion wie Neon), damit die
    # Migrationstests nicht nur gegen SQLite laufen
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fintrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Das React-Frontend wird im selben Job geprüft, damit der Branch-Schutz
      # ("test" muss grün sein) es automatisch mit abdeckt
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend prüfen (Typen, Lint, Tests, Build)
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npx vite build

      - name: Tests ausführen
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/fintrack_test
        run: pytest --cov=fintrack --cov=app --cov-report=term-missing

      # Container bauen und kurz starten (Rauchtest): ein kaputtes Dockerfile
      # fällt so auf, bevor es auf den Server geht. SQLite statt Neon, ohne Scheduler.
      - name: Container bauen und prüfen
        run: |
          docker build -t fintrack:ci .
          docker run -d --name fintrack -p 8000:8000             -e SECRET_KEY=nur-fuer-den-ci-test             -e DATABASE_URL=sqlite:////app/instance/ci.db             -e SCHEDULER_ENABLED=0             fintrack:ci
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz && break
            sleep 2
          done
          echo
          curl -fsS "http://127.0.0.1:8000/healthz?db=1"; echo
          curl -fsS http://127.0.0.1:8000/app/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8000/app/sw.js | grep -q "const VERSION = '[0-9a-f]"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/me)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)" = 302
          test "$(docker exec fintrack id -u)" = 10001
          echo "Container läuft."

      - name: Container-Log bei Fehler
        if: failure()
        run: docker logs fintrack || true
