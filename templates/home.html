<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceAdvisor - Home</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <div class="app-container">

        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-brand">FinanceAdvisor</div>
            <nav class="sidebar-nav">
                <a href="/home-page" class="active">Home</a>
                <a href="/portfolio-page">Portfolio</a>
                <a href="/budget-page">Haushaltsbuch</a>
                <a href="/chat-page">Chat</a>
                <a href="/analyse-page">Analyse</a>
                <a href="/settings-page">Einstellungen</a>
                <a href="#" onclick="logout()">Logout</a>
            </nav>
            <button class="theme-toggle" onclick="toggleTheme()">🌙 Dark / ☀️ Light</button>
        </div>

        <!-- Mobile Bottom Navigation - nur unter 768px sichtbar -->
        <nav class="bottom-nav">
            <a href="/home-page" class="active"><i class="fa-solid fa-house"></i>Home</a>
            <a href="/portfolio-page"><i class="fa-solid fa-chart-line"></i>Portfolio</a>
            <a href="/budget-page"><i class="fa-solid fa-wallet"></i>Budget</a>
            <a href="/chat-page"><i class="fa-solid fa-comment"></i>Chat</a>
            <a href="/analyse-page"><i class="fa-solid fa-magnifying-glass-chart"></i>Analyse</a>
            <button onclick="toggleMoreMenu()"><i class="fa-solid fa-ellipsis"></i>Mehr</button>
        </nav>

        <!-- Mobile "Mehr"-Menü -->
        <div id="more-menu" class="more-menu" style="display:none;">
            <div class="more-menu-overlay" onclick="toggleMoreMenu()"></div>
            <div class="more-menu-content">
                <a href="/settings-page"><i class="fa-solid fa-gear"></i> Einstellungen</a>
                <button onclick="toggleTheme()"><i class="fa-solid fa-circle-half-stroke"></i> Dark/Light Mode</button>
                <a href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
            </div>
        </div>

        <!-- Hauptbereich -->
        <div class="main-content">
            <h2>Home</h2>

            <div class="home-overview">
                <div class="home-overview-card glass-card">
                    <p>Portfolio-Wert</p>
                    <h3 id="home-portfolio-value"><span class="spinner"></span></h3>
                </div>
                <div class="home-overview-card glass-card">
                    <p>Cash-Bestand</p>
                    <h3 id="home-cash-balance"><span class="spinner"></span></h3>
                    <p id="home-current-month-balance" class="home-overview-sub"></p>
                </div>
                <div class="home-overview-card glass-card">
                    <p>Gesamtvermögen</p>
                    <h3 id="home-total-net-worth"><span class="spinner"></span></h3>
                </div>
            </div>
        </div>

    </div>

    <!-- FAB Button -->
    <div class="chat-fab" onclick="toggleChat()">
        🤖 KI-Agent
    </div>

    <!-- Chat Widget -->
    <div class="chat-widget" id="chat-widget" style="display:none;">
        <div class="chat-widget-header">
            <span>KI-Agent</span>
            <button onclick="toggleChat()">✕</button>
        </div>
        <div class="chat-widget-messages" id="widget-messages"></div>
        <div class="chat-widget-input">
            <input type="text" id="widget-input" placeholder="Schreib eine Nachricht...">
            <button onclick="sendWidgetMessage()">Senden</button>
        </div>
    </div>

    <script src="/static/js/toast.js"></script>
    <script src="/static/js/mobile-nav.js"></script>
    <script src="/static/js/home.js"></script>
    <script src="/static/js/logout.js"></script>
    <script src="/static/js/widget.js"></script>
    <script src="/static/js/theme.js"></script>
</body>
</html>
