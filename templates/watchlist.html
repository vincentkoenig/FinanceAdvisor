<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>FinanceAdvisor - Watchlist</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/watchlist.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <div class="app-container">

        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-brand">FinanceAdvisor</div>
            <nav class="sidebar-nav">
                <a href="/dashboard">Dashboard</a>
                <a href="/chat-page">Chat</a>
                <a href="/analyse-page">Analyse</a>
                <a href="/watchlist-page" class="active">Watchlist</a>
                <a href="/settings-page">Einstellungen</a>
                <a href="#" onclick="logout()">Logout</a>
            </nav>
            <button class="theme-toggle" onclick="toggleTheme()">🌙 Dark / ☀️ Light</button>
        </div>

        <!-- Hauptbereich -->
        <div class="main-content">
            <h2>Watchlist</h2>

            <!-- Asset hinzufügen -->
            <div class="watchlist-add">
                <input type="text" id="asset-search" placeholder="Asset suchen z.B. AAPL, bitcoin...">
                <button class="btn-primary" onclick="addToWatchlist()">Hinzufügen</button>
            </div>

            <!-- Watchlist Tabelle -->
            <table class="portfolio-table">
                <thead>
                    <tr>
                        <th onclick="sortWatchlist('name')" style="cursor: pointer;">Titel ↕</th>
                        <th onclick="sortWatchlist('symbol')" style="cursor: pointer;">Symbol ↕</th>
                        <th>Aktueller Preis</th>
                        <th>Preis beim Hinzufügen</th>
                        <th>Veränderung</th>
                    </tr>
                </thead>
                <tbody id="watchlist-body"></tbody>
            </table>
        </div>

    </div>

    <!-- FAB Button -->
    <div class="chat-fab" onclick="toggleChat()">
        🤖 KI-Agent
    </div>

    <!-- Chat Widget -->
    <div class="chat-widget" id="chat-widget" style="display:none;">
        <div class="chat-widget-header">
            <span>KI-Agent</span>
            <button onclick="toggleChat()">✕</button>
        </div>
        <div class="chat-widget-messages" id="widget-messages"></div>
        <div class="chat-widget-input">
            <input type="text" id="widget-input" placeholder="Schreib eine Nachricht...">
            <button onclick="sendWidgetMessage()">Senden</button>
        </div>
    </div>

    <!-- Modal: Watchlist Detail -->
    <div id="watchlist-detail-modal" style="display:none;">
        <div class="modal-overlay" onclick="hideWatchlistDetail()"></div>
        <div class="modal">
            <h3 id="watchlist-modal-asset-name">Asset</h3>
            <div class="modal-buttons">
                <button onclick="showWatchlistBuy()">Kaufen</button>
                <button onclick="removeFromWatchlistModal()">Von Watchlist entfernen</button>
            </div>

            <!-- Kauf Felder -->
            <div id="watchlist-buy-fields" style="display:none;">
                <input type="number" id="watchlist-buy-quantity" placeholder="Menge">
                <input type="number" id="watchlist-buy-price" placeholder="Kaufpreis">
                <button class="btn-primary" onclick="buyFromWatchlist()">Kaufen bestätigen</button>
            </div>

            <button class="btn-secondary" onclick="hideWatchlistDetail()">Schließen</button>
        </div>
    </div>

    <script src="/static/js/watchlist.js"></script>
    <script src="/static/js/logout.js"></script>
    <script src="/static/js/widget.js"></script>
    <script src="/static/js/theme.js"></script>
</body>
</html>
