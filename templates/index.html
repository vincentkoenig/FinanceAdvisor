<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#1e293b">
    <title>FinanceAdvisor</title>
    <link rel="stylesheet" href="/static/css/base.css">
</head>
<body>

    <div class="login-container">
        <h1>FinanceAdvisor</h1>
        <div class="login-card">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Passwort">
            <button class="btn-primary" onclick="login()">Einloggen</button>
            <button class="btn-secondary" onclick="register()">Registrieren</button>
        </div>
    </div>

    <!-- Modal: Email-Verifizierung -->
    <div id="verification-modal" style="display:none;">
        <div class="modal-overlay"></div>
        <div class="modal">
            <h3>Email bestätigen</h3>
            <p style="color: var(--text-secondary); font-size: 14px;">
                Wir haben dir einen 6-stelligen Code an deine Email-Adresse geschickt.
            </p>
            <input type="text" id="verification-code" placeholder="Code eingeben" maxlength="6">
            <button class="btn-primary" onclick="verifyEmail()">Bestätigen</button>
            <button class="btn-secondary" onclick="resendVerificationCode()">Code erneut senden</button>
        </div>
    </div>

    <script src="/static/js/toast.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/service-worker.js')
        }
    </script>
</body>
</html>
