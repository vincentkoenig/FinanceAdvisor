<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>FinanceAdvisor - Portfolio</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/portfolio.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <div class="app-container">

        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-brand">FinanceAdvisor</div>
            <nav class="sidebar-nav">
                <a href="/home-page">Home</a>
                <a href="/portfolio-page" class="active">Portfolio</a>
                <a href="/budget-page">Haushaltsbuch</a>
                <a href="/chat-page">Chat</a>
                <a href="/analyse-page">Analyse</a>
                <a href="/watchlist-page">Watchlist</a>
                <a href="/settings-page">Einstellungen</a>
                <a href="#" onclick="logout()">Logout</a>
            </nav>
            <button class="theme-toggle" onclick="toggleTheme()">🌙 Dark / ☀️ Light</button>
        </div>

        <!-- Positionen -->
        <div class="main-content">

            <!-- Oberer Bereich: Chart + Donut -->
            <div class="dashboard-top">

                <!-- Links: Gesamtwert + Liniendiagramm -->
                <div class="chart-container">
                    <h3>Portfolio</h3>
                    <div class="total-value-row">
                        <h3 id="total-value"><span class="spinner"></span></h3>
                        <button class="eye-button" onclick="toggleVisibility()">
                            <i id="eye-icon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <p id="total-pl"><span class="spinner"></span></p>
                    <canvas id="lineChart"></canvas>

                    <!-- Zeitraum Buttons -->
                    <div class="chart-period-buttons">
                        <button onclick="changeChartPeriod('1W')" class="period-btn" id="btn-1W">1W</button>
                        <button onclick="changeChartPeriod('1M')" class="period-btn" id="btn-1M">1M</button>
                        <button onclick="changeChartPeriod('YTD')" class="period-btn" id="btn-YTD">YTD</button>
                        <button onclick="changeChartPeriod('1J')" class="period-btn active" id="btn-1J">1J</button>
                        <button onclick="changeChartPeriod('Max')" class="period-btn" id="btn-Max">Max</button>
                    </div>
                </div>

                <!-- Rechts: Donut Diagramm -->
                <div class="donut-container glass-card">
                    <h3>Allokation</h3>
                    <div class="donut-chart-wrapper">
                        <canvas id="donutChart"></canvas>
                        <div class="donut-center">
                            <p>Gesamtvermögen</p>
                            <h3 id="donut-value"><span class="spinner"></span></h3>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Unterer Bereich: Positionen -->
            <div class="positions-container">
                <div class="section-header">
                    <h2>Positionen</h2>
                    <button class="btn-primary add-button" onclick="showAddPosition()">+ Position hinzufügen</button>
                </div>
                <table class="portfolio-table">
                    <thead>
                        <tr>
                            <th onclick="sortTable('name')" style="cursor: pointer;">Titel ↕</th>
                            <th onclick="sortTable('kaufpreis')" style="cursor: pointer;">Kaufpreis ↕</th>
                            <th onclick="sortTable('position')" style="cursor: pointer;">Position ↕</th>
                            <th onclick="sortTable('pl')" style="cursor: pointer;">P/L ↕</th>
                        </tr>
                    </thead>
                    <tbody id="portfolio-body"></tbody>
                    <tfoot>
                        <tr>
                            <td><strong>Gesamt</strong></td>
                            <td id="total-kaufpreis"></td>
                            <td id="total-position"></td>
                            <td id="total-pl-table"></td>
                        </tr>
                    </tfoot>
                </table>
            </div>

    </div>

   <!-- Modal: Position hinzufügen -->
    <div id="add-position-modal" style="display:none;">
        <div class="modal-overlay" onclick="hideAddPosition()"></div>
        <div class="modal">
            <h3>Position hinzufügen</h3>
            <input type="text" id="position-symbol" placeholder="Symbol z.B. AAPL, bitcoin">
            <input type="number" id="position-quantity" placeholder="Menge z.B. 10">
            <input type="number" id="position-price" placeholder="Kaufpreis z.B. 150">
            <input type="date" id="position-date">
            <button class="btn-primary" onclick="addPosition()">Hinzufügen</button>
            <button class="btn-secondary" onclick="hideAddPosition()">Abbrechen</button>
        </div>
    </div>

<!-- Modal: Asset Details -->
<div id="asset-detail-modal" style="display:none;">
    <div class="modal-overlay" onclick="hideAssetDetail()"></div>
    <div class="modal">
        <h3 id="modal-asset-name">Asset</h3>
        <div class="modal-buttons">
            <button onclick="showBuy()">Kauf hinzufügen</button>
            <button onclick="showSell()">Verkauf hinzufügen</button>
        </div>

        <!-- Kauf Felder -->
        <div id="buy-fields" style="display:none;">
            <input type="number" id="buy-quantity" placeholder="Menge">
            <input type="number" id="buy-price" placeholder="Kaufpreis">
            <button class="btn-primary" onclick="addBuy()">Bestätigen</button>
        </div>

        <!-- Verkauf Felder -->
        <div id="sell-fields" style="display:none;">
            <input type="number" id="sell-quantity" placeholder="Menge">
            <input type="number" id="sell-price" placeholder="Verkaufspreis">
            <button class="btn-primary" onclick="addSell()">Bestätigen</button>
        </div>

        <button class="btn-secondary" onclick="hideAssetDetail()">Schließen</button>
    </div>
</div>

    <!-- FAB Button -->
    <div class="chat-fab" onclick="toggleChat()">
        🤖 KI-Agent
    </div>

    <!-- Chat Widget -->
    <div class="chat-widget" id="chat-widget" style="display:none;">
        <div class="chat-widget-header">
            <span>KI-Agent</span>
            <button onclick="toggleChat()">✕</button>
        </div>
        <div class="chat-widget-messages" id="widget-messages"></div>
        <div class="chat-widget-input">
            <input type="text" id="widget-input" placeholder="Schreib eine Nachricht...">
            <button onclick="sendWidgetMessage()">Senden</button>
        </div>
    </div>

    <script src="/static/js/toast.js"></script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/portfolio.js"></script>
    <script src="/static/js/logout.js"></script>
    <script src="/static/js/widget.js"></script>
    <script src="/static/js/theme.js"></script>
</body>
</html>
