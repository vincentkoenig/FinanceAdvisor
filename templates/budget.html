<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>FinanceAdvisor - Haushaltsbuch</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/budget.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <div class="app-container">

        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-brand">FinanceAdvisor</div>
            <nav class="sidebar-nav">
                <a href="/home-page">Home</a>
                <a href="/portfolio-page">Portfolio</a>
                <a href="/budget-page" class="active">Haushaltsbuch</a>
                <a href="/chat-page">Chat</a>
                <a href="/analyse-page">Analyse</a>
                <a href="/watchlist-page">Watchlist</a>
                <a href="/settings-page">Einstellungen</a>
                <a href="#" onclick="logout()">Logout</a>
            </nav>
            <button class="theme-toggle" onclick="toggleTheme()">🌙 Dark / ☀️ Light</button>
        </div>

        <!-- Hauptbereich -->
        <div class="main-content">
            <h2>Haushaltsbuch</h2>
            <p>Kommt gleich...</p>
        </div>

    </div>

    <!-- FAB Button -->
    <div class="chat-fab" onclick="toggleChat()">
        🤖 KI-Agent
    </div>

    <!-- Chat Widget -->
    <div class="chat-widget" id="chat-widget" style="display:none;">
        <div class="chat-widget-header">
            <span>KI-Agent</span>
            <button onclick="toggleChat()">✕</button>
        </div>
        <div class="chat-widget-messages" id="widget-messages"></div>
        <div class="chat-widget-input">
            <input type="text" id="widget-input" placeholder="Schreib eine Nachricht...">
            <button onclick="sendWidgetMessage()">Senden</button>
        </div>
    </div>

    <script src="/static/js/toast.js"></script>
    <script src="/static/js/budget.js"></script>
    <script src="/static/js/logout.js"></script>
    <script src="/static/js/widget.js"></script>
    <script src="/static/js/theme.js"></script>
</body>
</html>
