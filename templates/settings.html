<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#1e293b">
    <title>FinanceAdvisor - Einstellungen</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/settings.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <div class="app-container">

        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-brand">FinanceAdvisor</div>
            <nav class="sidebar-nav">
                <a href="/home-page">Home</a>
                <a href="/portfolio-page">Portfolio</a>
                <a href="/budget-page">Haushaltsbuch</a>
                <a href="/chat-page">Chat</a>
                <a href="/analyse-page">Analyse</a>
                <a href="/settings-page" class="active">Einstellungen</a>
                <a href="#" onclick="logout()">Logout</a>
            </nav>
            <button class="theme-toggle" onclick="toggleTheme()">🌙 Dark / ☀️ Light</button>
        </div>

        <!-- Mobile Bottom Navigation - nur unter 768px sichtbar -->
        <nav class="bottom-nav">
            <a href="/home-page"><i class="fa-solid fa-house"></i>Home</a>
            <a href="/portfolio-page"><i class="fa-solid fa-chart-line"></i>Portfolio</a>
            <a href="/budget-page"><i class="fa-solid fa-wallet"></i>Budget</a>
            <a href="/chat-page"><i class="fa-solid fa-comment"></i>Chat</a>
            <a href="/analyse-page"><i class="fa-solid fa-magnifying-glass-chart"></i>Analyse</a>
            <button onclick="toggleMoreMenu()"><i class="fa-solid fa-ellipsis"></i>Mehr</button>
        </nav>

        <!-- Mobile "Mehr"-Menü -->
        <div id="more-menu" class="more-menu" style="display:none;">
            <div class="more-menu-overlay" onclick="toggleMoreMenu()"></div>
            <div class="more-menu-content">
                <a href="/settings-page" class="active"><i class="fa-solid fa-gear"></i> Einstellungen</a>
                <button onclick="toggleTheme()"><i class="fa-solid fa-circle-half-stroke"></i> Dark/Light Mode</button>
                <a href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
            </div>
        </div>

        <!-- Hauptbereich -->
        <div class="main-content">
            <h2>Einstellungen</h2>

            <div class="settings-card glass-card">
                <h3>Profil</h3>

                <label>Risikoprofil</label>
                <select id="risk_profile">
                    <option value="conservative">Konservativ</option>
                    <option value="balanced">Ausgewogen</option>
                    <option value="aggressive">Aggressiv</option>
                </select>

                <label>Erfahrung</label>
                <select id="investment_experience">
                    <option value="beginner">Anfänger</option>
                    <option value="intermediate">Fortgeschritten</option>
                    <option value="expert">Experte</option>
                </select>

                <label>Monatliches Budget (€)</label>
                <input type="number" id="monthly_budget" placeholder="z.B. 500">

                <label>Anlagehorizont</label>
                <select id="investment_horizon">
                    <option value="short-term">Kurzfristig</option>
                    <option value="medium-term">Mittelfristig</option>
                    <option value="long-term">Langfristig</option>
                </select>

                <button class="btn-primary settings-button" onclick="saveSettings()">Speichern</button>
            </div>
        </div>

    </div>

    <!-- FAB Button -->
    <div class="chat-fab" onclick="toggleChat()">
        🤖 KI-Agent
    </div>

    <!-- Chat Widget -->
    <div class="chat-widget" id="chat-widget" style="display:none;">
        <div class="chat-widget-header">
            <span>KI-Agent</span>
            <button onclick="toggleChat()">✕</button>
        </div>
        <div class="chat-widget-messages" id="widget-messages"></div>
        <div class="chat-widget-input">
            <input type="text" id="widget-input" placeholder="Schreib eine Nachricht...">
            <button onclick="sendWidgetMessage()">Senden</button>
        </div>
    </div>

    <script src="/static/js/toast.js"></script>
    <script src="/static/js/mobile-nav.js"></script>
    <script src="/static/js/settings.js"></script>
    <script src="/static/js/logout.js"></script>
    <script src="/static/js/widget.js"></script>
    <script src="/static/js/theme.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/service-worker.js')
        }
    </script>
</body>
</html>
