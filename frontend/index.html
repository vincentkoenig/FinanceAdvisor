<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08140f" />
    <link rel="icon" type="image/svg+xml" href="/app/icon.svg" />
    <title>FinTrack</title>
    <script>
      // Design vor dem ersten Zeichnen setzen, damit nichts aufblitzt
      try { var t = localStorage.getItem('fintrack-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
